name: CI

on:
  push:
    branches: [main]
  pull_request:

# A workflow that only reads a checkout and runs tests needs nothing else. The
# default token is read-only on this repository today, but that is a repository
# setting somebody can change; this is the workflow saying so for itself.
permissions:
  contents: read

env:
  DATABASE_URL: file:./ci-test.db

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit, with the tag in the comment. A mutable
      # tag is a promise from whoever can still move it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: node scripts/run-local.js typescript --noEmit

      - name: Unit tests
        run: npm test

      - name: Push database schema
        run: npm run db:push -- --skip-generate

      - name: Build
        run: npm run build

  # The Origin check — the whole of the CSRF defence — is asserted in the
  # browser suite and nowhere else, and the browser suite never ran here. A
  # refactor of the middleware could land green. It also runs against the
  # production server, so the policy being tested is the one customers get,
  # not the dev server's looser one.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: node scripts/run-local.js playwright install --with-deps chromium

      - name: Prepare the database
        run: |
          npm run db:push -- --skip-generate
          npm run db:seed

      - name: Build
        run: npm run build

      - name: Browser tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Advisories are a standing report, not a gate that blocks a bug fix: the
  # Next.js 14 line is out of support and cannot go green until the 15.x
  # migration lands (see NVX-004 in docs/SECURITY_REVIEW.md). Production
  # dependencies at critical severity are the line that does fail the build.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report every advisory
        run: npm audit || true

      - name: Fail on a critical one in what ships
        run: npm audit --omit=dev --audit-level=critical
